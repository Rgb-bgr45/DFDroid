name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK/NDK
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Bagimliliklari indir
        run: bash scripts/fetch_deps.sh
      - name: gl4es
        run: bash scripts/build_gl4es.sh
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: APK derle
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DFDroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
